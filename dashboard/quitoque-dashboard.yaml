title: Quitoque
path: quitoque
icon: mdi:food-variant
panel: true
cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - padding: 0
        - border-radius: 18px
        - overflow: hidden
        - width: 100%
        - max-width: 100%
        - box-sizing: border-box
      grid:
        - grid-template-areas: |
            "header"
            "table"
        - grid-template-columns: minmax(0, 1fr)
        - grid-template-rows: auto auto
        - width: 100%
      custom_fields:
        header:
          - width: 100%
        table:
          - width: 100%
          - justify-self: stretch
    custom_fields:
      header:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          styles:
            card:
              - padding: 12px 0 12px 16px
              - border-radius: 0
              - box-shadow: none
              - background: transparent
              - width: 100%
              - max-width: 100%
              - box-sizing: border-box
            grid:
              - grid-template-areas: '"brand stats actions"'
              - grid-template-columns: minmax(280px, 1fr) 330px minmax(0, 1.6fr)
              - column-gap: 8px
              - align-items: center
              - width: 100%
            custom_fields:
              brand:
                - min-width: 0
              stats:
                - width: 100%
              actions:
                - width: 100%
                - min-width: 0
                - justify-self: stretch
          custom_fields:
            brand: |
              [[[
                return `
                  <div style="
                    display:flex;
                    align-items:center;
                    gap:14px;
                    min-width:0;
                  ">
                    <img
                      src="https://raw.githubusercontent.com/AuroreVgn/quitoque/main/custom_components/quitoque/brand/icon.png"
                      onerror="this.onerror=null;this.src='/api/brands/integration/quitoque/icon.png';"
                      style="
                        width:56px;
                        height:56px;
                        border-radius:14px;
                        object-fit:contain;
                        flex:0 0 auto;
                      "
                    >
                    <div>
                      <div style="
                        font-size:31px;
                        font-weight:800;
                        line-height:1.05;
                      ">
                        Quitoque
                      </div>
                      <div style="
                        font-size:13px;
                        opacity:.62;
                        margin-top:5px;
                        white-space:nowrap;
                      ">
                        Liste des recettes Quitoque
                      </div>
                    </div>
                  </div>
                `;
              ]]]
            stats: |
              [[[
                const first = (...ids) =>
                  ids.map(id => states[id]).find(e => e !== undefined);

                const recipeGroups = [
                  [
                    'sensor.quitoque_nombre_de_recettes_cette_semaine',
                    'sensor.quitoque_recipes_this_week',
                    'sensor.quitoque_recipes_in_0_weeks'
                  ],
                  [
                    'sensor.quitoque_nombre_de_recettes_dans_1_semaine',
                    'sensor.quitoque_recipes_in_1_week'
                  ],
                  [
                    'sensor.quitoque_nombre_de_recettes_dans_2_semaines',
                    'sensor.quitoque_recipes_in_2_weeks'
                  ],
                  [
                    'sensor.quitoque_nombre_de_recettes_dans_3_semaines',
                    'sensor.quitoque_recipes_in_3_weeks'
                  ],
                  [
                    'sensor.quitoque_nombre_de_recettes_dans_4_semaines',
                    'sensor.quitoque_recipes_in_4_weeks'
                  ]
                ];

                const deliveryGroups = [
                  [
                    'sensor.quitoque_livraison_cette_semaine',
                    'sensor.quitoque_delivery_this_week',
                    'sensor.quitoque_delivery_in_0_weeks'
                  ],
                  [
                    'sensor.quitoque_livraison_dans_1_semaine',
                    'sensor.quitoque_delivery_in_1_week'
                  ],
                  [
                    'sensor.quitoque_livraison_dans_2_semaines',
                    'sensor.quitoque_delivery_in_2_weeks'
                  ],
                  [
                    'sensor.quitoque_livraison_dans_3_semaines',
                    'sensor.quitoque_delivery_in_3_weeks'
                  ],
                  [
                    'sensor.quitoque_livraison_dans_4_semaines',
                    'sensor.quitoque_delivery_in_4_weeks'
                  ]
                ];

                const totalRecipes = recipeGroups.reduce(
                  (sum, ids) =>
                    sum + (parseInt(first(...ids)?.state || 0) || 0),
                  0
                );

                const totalBoxes = deliveryGroups.filter(
                  ids => first(...ids)?.attributes?.active_delivery === true
                ).length;

                const sync = first(
                  'sensor.quitoque_derniere_synchronisation_du_calendrier',
                  'sensor.quitoque_last_calendar_synchronization'
                );

                let syncText = 'Jamais';
                if (sync && !['unknown','unavailable'].includes(sync.state)) {
                  try {
                    syncText = new Date(sync.state).toLocaleString('fr-FR', {
                      day:'2-digit',
                      month:'2-digit',
                      hour:'2-digit',
                      minute:'2-digit'
                    });
                  } catch (_) {
                    syncText = sync.state;
                  }
                }

                return `
                  <div style="
                    display:grid;
                    grid-template-columns:90px 90px 135px;
                    gap:7px;
                  ">
                    <div style="
                      padding:8px 9px;
                      border-radius:12px;
                      background:rgba(120,120,120,.08);
                      text-align:center;
                    ">
                      <div style="font-size:21px;font-weight:800">
                        ${totalRecipes}
                      </div>
                      <div style="font-size:14px;opacity:.6">
                        recettes
                      </div>
                    </div>

                    <div style="
                      padding:8px 9px;
                      border-radius:12px;
                      background:rgba(120,120,120,.08);
                      text-align:center;
                    ">
                      <div style="font-size:21px;font-weight:800">
                        ${totalBoxes}
                      </div>
                      <div style="font-size:14px;opacity:.6">
                        box prévues
                      </div>
                    </div>

                    <div style="
                      padding:8px 9px;
                      border-radius:12px;
                      background:rgba(120,120,120,.08);
                      text-align:center;
                    ">
                      <div style="
                        font-size:15px;
                        opacity:.65;
                        text-transform:uppercase;
                      ">
                        Dernière sync
                      </div>
                      <div style="
                        font-size:18px;
                        font-weight:750;
                        margin-top:4px;
                      ">
                        ${syncText}
                      </div>
                    </div>
                  </div>
                `;
              ]]]
            actions:
              card:
                type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: |
                          [[[
                            const ids = [
                              'button.quitoque_refresh',
                              'button.quitoque_actualiser'
                            ];
                            return ids.find(id => states[id] !== undefined) || ids[0];
                          ]]]
                    styles:
                      card:
                        - padding: 0
                        - border-radius: 0
                        - box-shadow: none
                        - background: transparent
                        - height: 100%
                      grid:
                        - grid-template-areas: '"button"'
                        - grid-template-columns: 1fr
                        - width: 100%
                      custom_fields:
                        button:
                          - width: 100%
                          - height: 100%
                          - pointer-events: none
                    custom_fields:
                      button:
                        card:
                          type: custom:mushroom-template-card
                          primary: Actualiser
                          secondary: les données
                          icon: mdi:refresh
                          icon_color: blue
                          layout: horizontal
                          fill_container: true
                          tap_action:
                            action: none
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: |
                          [[[
                            const ids = [
                              'button.quitoque_add_recipes_to_calendar',
                              'button.quitoque_ajouter_les_recettes_au_calendrier',
                              'button.quitoque_sync_calendar'
                            ];
                            return ids.find(id => states[id] !== undefined) || ids[0];
                          ]]]
                    styles:
                      card:
                        - padding: 0
                        - border-radius: 0
                        - box-shadow: none
                        - background: transparent
                        - height: 100%
                      grid:
                        - grid-template-areas: '"button"'
                        - grid-template-columns: 1fr
                        - width: 100%
                      custom_fields:
                        button:
                          - width: 100%
                          - height: 100%
                          - pointer-events: none
                    custom_fields:
                      button:
                        card:
                          type: custom:mushroom-template-card
                          primary: Ajouter
                          secondary: au calendrier
                          icon: mdi:calendar-plus
                          icon_color: green
                          layout: horizontal
                          fill_container: true
                          tap_action:
                            action: none
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: |
                          [[[
                            const ids = [
                              'button.quitoque_generate_and_download_pdfs',
                              'button.quitoque_generer_et_telecharger_les_pdf',
                              'button.quitoque_quitoque_generer_les_pdf_recette',
                              'button.quitoque_export_pdf'
                            ];
                            return ids.find(id => states[id] !== undefined) || ids[0];
                          ]]]
                    styles:
                      card:
                        - padding: 0
                        - border-radius: 0
                        - box-shadow: none
                        - background: transparent
                        - height: 100%
                      grid:
                        - grid-template-areas: '"button"'
                        - grid-template-columns: 1fr
                        - width: 100%
                      custom_fields:
                        button:
                          - width: 100%
                          - height: 100%
                          - pointer-events: none
                    custom_fields:
                      button:
                        card:
                          type: custom:mushroom-template-card
                          primary: Générer PDF
                          secondary: fiches + ZIP
                          icon: mdi:file-pdf-box
                          icon_color: red
                          layout: horizontal
                          fill_container: true
                          tap_action:
                            action: none
                  - type: custom:mushroom-template-card
                    primary: Calendrier
                    secondary: Ouvrir le calendrier
                    icon: mdi:calendar-month
                    icon_color: orange
                    layout: horizontal
                    fill_container: true
                    tap_action:
                      action: url
                      url_path: >-
                        https://my.home-assistant.io/redirect/calendar
      table: |
        [[[
          const first = (...ids) =>
            ids.map(id => states[id]).find(e => e !== undefined);

          const weeks = [
            {
              offset: 'S0',
              label: 'Cette semaine',
              accent: '#4f9dd9',
              delivery: first(
                'sensor.quitoque_livraison_cette_semaine',
                'sensor.quitoque_delivery_this_week',
                'sensor.quitoque_delivery_in_0_weeks'
              ),
              recipes: first(
                'sensor.quitoque_nombre_de_recettes_cette_semaine',
                'sensor.quitoque_recipes_this_week',
                'sensor.quitoque_recipes_in_0_weeks'
              )
            },
            {
              offset: 'S+1',
              label: 'Dans 1 semaine',
              accent: '#3eb489',
              delivery: first(
                'sensor.quitoque_livraison_dans_1_semaine',
                'sensor.quitoque_delivery_in_1_week'
              ),
              recipes: first(
                'sensor.quitoque_nombre_de_recettes_dans_1_semaine',
                'sensor.quitoque_recipes_in_1_week'
              )
            },
            {
              offset: 'S+2',
              label: 'Dans 2 semaines',
              accent: '#b7e136',
              delivery: first(
                'sensor.quitoque_livraison_dans_2_semaines',
                'sensor.quitoque_delivery_in_2_weeks'
              ),
              recipes: first(
                'sensor.quitoque_nombre_de_recettes_dans_2_semaines',
                'sensor.quitoque_recipes_in_2_weeks'
              )
            },
            {
              offset: 'S+3',
              label: 'Dans 3 semaines',
              accent: '#ff9f1a',
              delivery: first(
                'sensor.quitoque_livraison_dans_3_semaines',
                'sensor.quitoque_delivery_in_3_weeks'
              ),
              recipes: first(
                'sensor.quitoque_nombre_de_recettes_dans_3_semaines',
                'sensor.quitoque_recipes_in_3_weeks'
              )
            },
            {
              offset: 'S+4',
              label: 'Dans 4 semaines',
              accent: '#b277f2',
              delivery: first(
                'sensor.quitoque_livraison_dans_4_semaines',
                'sensor.quitoque_delivery_in_4_weeks'
              ),
              recipes: first(
                'sensor.quitoque_nombre_de_recettes_dans_4_semaines',
                'sensor.quitoque_recipes_in_4_weeks'
              )
            }
          ];

          const rows = weeks.map((w, index) => {
            const delivery = w.delivery;
            const recipesEntity = w.recipes;

            const recipes = recipesEntity?.attributes?.recipes || [];
            const recipeDetails = recipesEntity?.attributes?.recipe_details || [];
            const count = parseInt(recipesEntity?.state || 0) || 0;

            const active =
              delivery?.attributes?.active_delivery === true;

            const week =
              delivery?.attributes?.week ?? '—';

            const start =
              delivery?.attributes?.delivery_start_hour;

            const end =
              delivery?.attributes?.delivery_end_hour;

            let date = 'Aucune livraison';

            if (
              active &&
              delivery &&
              !['Non','No','unknown','unavailable'].includes(delivery.state)
            ) {
              try {
                const d = new Date(delivery.state);
                const days = [
                  'dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'
                ];
                const months = [
                  'janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                  'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'
                ];
                date = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
              } catch (_) {}
            }

            const slot = (
              active &&
              start !== undefined &&
              start !== null &&
              end !== undefined &&
              end !== null
            )
              ? `${String(start).padStart(2,'0')}h00 - ${String(end).padStart(2,'0')}h00`
              : '';

            const recipeItems = recipeDetails.length
              ? recipeDetails
              : recipes.map(name => ({ name, kitchen_duration_minutes: null }));

            const recipesHtml = recipeItems.length
              ? recipeItems.map(r => `
                  <div style="
                    padding:9px 11px;
                    border-radius:10px;
                    background:rgba(120,120,120,.07);
                    min-width:0;
                    text-align:center;
                  ">
                    <div style="
                      display:inline-flex;
                      gap:4px;
                      align-items:center;
                      justify-content:flex-start;
                      max-width:100%;
                      text-align:left;
                    ">
                      <ha-icon
                        icon="mdi:food"
                        style="
                          width:15px;
                          min-width:15px;
                          color:${w.accent};
                        "
                      ></ha-icon>
                      <div style="
                        min-width:0;
                        font-size:14px;
                        line-height:1.3;
                        text-align:left;
                        white-space:normal;
                        overflow:visible;
                        word-break:break-word;
                      ">
                        ${r.name}${r.kitchen_duration_minutes ? `
                          <span style="opacity:.6; white-space:nowrap;">
                            (${r.kitchen_duration_minutes} min)
                          </span>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                `).join('')
              : `
                  <div style="
                    opacity:.45;
                    font-size:14px;
                    grid-column:1 / -1;
                    align-self:center;
                    justify-self:center;
                  ">
                    Aucune recette disponible pour le moment.
                  </div>
                `;

            return `
              <div style="
                width:100%;
                box-sizing:border-box;
                display:grid;
                grid-template-columns:120px 260px 110px minmax(0,1fr);
                min-height:155px;
                border-top:${index === 0 ? '0' : '1px solid rgba(120,120,120,.12)'};
                border-bottom:1px solid ${w.accent}55;
              ">

                <div style="
                  background:${w.accent}20;
                  border-right:1px solid ${w.accent}55;
                  display:flex;
                  flex-direction:column;
                  justify-content:center;
                  align-items:center;
                  text-align:center;
                  padding:14px 10px;
                ">
                  <div style="
                    font-size:30px;
                    font-weight:800;
                    color:${w.accent};
                  ">
                    ${w.offset}
                  </div>

                  <div style="
                    font-size:14px;
                    opacity:.68;
                    margin-top:4px;
                  ">
                    ${w.label}
                  </div>

                  <div style="
                    margin-top:10px;
                    padding:4px 9px;
                    border-radius:9px;
                    font-size:11px;
                    background:${active ? w.accent + '28' : 'rgba(120,120,120,.08)'};
                    color:${active ? w.accent : 'inherit'};
                  ">
                    ${active ? 'Active' : 'Aucune box'}
                  </div>
                </div>

                <div style="
                  border-right:1px solid rgba(120,120,120,.12);
                  display:flex;
                  flex-direction:column;
                  justify-content:center;
                  padding:16px 20px;
                ">
                  <div style="
                    font-size:13px;
                    opacity:.55;
                  ">
                    Semaine ${week}
                  </div>

                  <div style="
                    font-size:21px;
                    font-weight:750;
                    margin-top:4px;
                    white-space:nowrap;
                  ">
                    ${date}
                  </div>

                  ${slot ? `
                    <div style="
                      font-size:13px;
                      opacity:.62;
                      margin-top:5px;
                    ">
                      ${slot}
                    </div>
                  ` : ''}

                  <ha-icon
                    icon="mdi:truck-delivery"
                    style="
                      width:17px;
                      color:${w.accent};
                      margin-top:8px;
                    "
                  ></ha-icon>
                </div>

                <div style="
                  border-right:1px solid rgba(120,120,120,.10);
                  display:flex;
                  align-items:center;
                  justify-content:center;
                ">
                  <div style="
                    width:74px;
                    height:74px;
                    border-radius:50%;
                    border:4px solid ${w.accent};
                    display:flex;
                    flex-direction:column;
                    align-items:center;
                    justify-content:center;
                  ">
                    <div style="
                      font-size:23px;
                      font-weight:800;
                    ">
                      ${count}
                    </div>
                    <div style="
                      font-size:11px;
                      opacity:.6;
                    ">
                      recettes
                    </div>
                  </div>
                </div>

                <div style="
                  padding:12px 14px;
                  display:grid;
                  grid-template-columns:repeat(3,minmax(0,1fr));
                  gap:8px;
                  align-content:center;
                  min-width:0;
                ">
                  ${recipesHtml}
                </div>
              </div>
            `;
          }).join('');

          return `
            <div style="
              width:100%;
              box-sizing:border-box;
            ">
              ${rows}
            </div>
          `;
        ]]]
